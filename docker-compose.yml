services:
  babel:
    build: .
    image: babel-discord-translator:local
    container_name: babel-translator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BABEL_APP: ${BABEL_APP:-guild}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
      BABEL_DB_PATH: ${BABEL_DB_PATH:-/app/data/babel.sqlite}
      BABEL_NODE_MAX_OLD_SPACE_MB: ${BABEL_NODE_MAX_OLD_SPACE_MB:-64}
      BABEL_NODE_MAX_SEMI_SPACE_MB: ${BABEL_NODE_MAX_SEMI_SPACE_MB:-4}
    ports:
      - "${DASHBOARD_PORT:-3000}:${DASHBOARD_PORT:-3000}"
    volumes:
      - babel_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://localhost:$${DASHBOARD_PORT:-3000}/livez\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  babel_data:
